<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="components.css"><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap">
<style>body{margin:0;background:var(--surface);}</style></head>
<body class="tk">
<form style="padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:24px" onsubmit="return false">
<div class="tk-field"><label for="n">Full name</label><input class="tk-input" id="n" placeholder="Your name"></div>
<div class="tk-field"><label for="e">Email</label><input class="tk-input" id="e" type="email" value="info@teebatkarbala" aria-invalid="true" aria-describedby="e-err"><span class="tk-field__error" id="e-err">Enter a valid email address.</span></div>
<div class="tk-field" dir="rtl" lang="ar"><label for="a">الاسم الكامل</label><input class="tk-input" id="a" placeholder="اكتب اسمك"></div>
<div class="tk-field"><label for="d">Reference</label><input class="tk-input" id="d" value="KIA-2026-0142" disabled></div>
<div class="tk-field" style="grid-column:1/-1"><label for="m">Message</label><textarea class="tk-textarea" id="m" placeholder="How can we help?"></textarea></div>
</form>
</body>
</html>
